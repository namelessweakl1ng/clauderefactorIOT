input {
  # Filebeat (Docker sensors, Cowrie)
  beats { port => 5044 }
  # Native sensor agents (sensor/honeypots/agent.py) POST newline-delimited
  # {"message": <raw JSONL line>, "fields": {...}} records: the same shape Filebeat
  # produces, so every downstream filter is shared.
  http {
    port => 5045
    user => "${TRAPSIG_INGEST_USER:trapsig}"
    password => "${TRAPSIG_INGEST_PASSWORD:change-this-ingest-password}"
    ecs_compatibility => disabled
    additional_codecs => { "application/x-ndjson" => "json_lines" }
    tags => ["_trapsig_agent"]
  }
}
filter {
  # Request metadata from the HTTP input must never leak into honeypot fields.
  if "_trapsig_agent" in [tags] { mutate { remove_field => ["headers", "host"] remove_tag => ["_trapsig_agent"] } }
  mutate { add_field => { "[@metadata][trapsig_original]" => "%{message}" } }
  json { source => "message" target => "raw" tag_on_failure => ["_trapsig_parse_failure"] }
  if [fields][log_family] == "zeek" {
    if ![raw][ts] { mutate { add_tag => ["_trapsig_parse_failure"] } }
  } else if ![raw][timestamp] and ![raw][@timestamp] { mutate { add_tag => ["_trapsig_parse_failure"] } }
}
