# Passive network intelligence from Zeek JSON logs (optional sensor `netmon`
# profile). Records go to trapsig-network-* only -- never into honeypot events --
# so sessionisation and experiment semantics are unchanged. conn records carry
# Zeek's community_id (policy/protocols/conn/community-id-logging), the exact
# join key with sensor-side honeypot telemetry.
filter {
  if [fields][log_family] == "zeek" and "_trapsig_parse_failure" not in [tags] {
    mutate { add_field => { "[@metadata][trapsig_family]" => "zeek" } }
    fingerprint { source => "message" target => "[event][id]" method => "SHA256" }
    ruby {
      code => '
        raw = event.get("raw") || {}
        log = event.get("[fields][zeek_log]").to_s
        event.set("[event][dataset]", "zeek.#{log}")
        event.set("[event][kind]", "event")
        event.set("[event][ingested]", LogStash::Timestamp.now)
        begin
          event.set("@timestamp", LogStash::Timestamp.at(Float(raw["ts"])))
        rescue
          event.tag("_trapsig_validation_failure")
          event.set("[trapsig][dead_letter_reason]", "invalid_zeek_ts")
        end
        event.set("[source][ip]", raw["id.orig_h"]) if raw["id.orig_h"]
        event.set("[source][port]", raw["id.orig_p"]) if raw["id.orig_p"]
        event.set("[destination][ip]", raw["id.resp_h"]) if raw["id.resp_h"]
        event.set("[destination][port]", raw["id.resp_p"]) if raw["id.resp_p"]
        event.set("[network][transport]", raw["proto"]) if raw["proto"]
        event.set("[network][protocol]", raw["service"]) if raw["service"]
        event.set("[network][community_id]", raw["community_id"]) if raw["community_id"]
        keep = {
          "conn" => %w[uid duration orig_bytes resp_bytes conn_state history missed_bytes orig_pkts resp_pkts orig_ip_bytes resp_ip_bytes local_orig local_resp],
          "dns" => %w[uid trans_id query qclass_name qtype_name rcode_name AA TC RD RA answers rejected],
          "http" => %w[uid method host uri user_agent status_code request_body_len response_body_len],
          "ssl" => %w[uid version cipher server_name established ja3 ja3s]
        }.fetch(log, %w[uid])
        keep.each { |key| event.set("[zeek][#{key}]", raw[key]) unless raw[key].nil? }
        event.set("[trapsig][sensor_id]", event.get("[fields][sensor_id]"))
        event.set("[trapsig][schema_version]", "2")
        source = raw["id.orig_h"].to_s
        event.set("[trapsig][internal]", source.start_with?("127.") || source == "::1")
      '
    }
  }
}
