filter {
  if [fields][honeypot_type] != "ssh_telnet" and [fields][log_family] != "zeek" and "_trapsig_parse_failure" not in [tags] {
    mutate { add_field => {
      "[event][id]" => "%{[raw][event_id]}" "[event][category]" => "%{[raw][category]}"
      "[event][type]" => "%{[raw][type]}" "[event][action]" => "%{[raw][action]}"
      "[event][outcome]" => "%{[raw][outcome]}" "[source][ip]" => "%{[raw][source_ip]}"
      "[source][port]" => "%{[raw][source_port]}" "[destination][port]" => "%{[raw][destination_port]}"
      "[destination][ip]" => "%{[fields][sensor_ip]}"
      "[network][transport]" => "tcp" "[network][protocol]" => "%{[raw][protocol]}"
      "[service][name]" => "%{[raw][service]}" "[honeypot][id]" => "%{[raw][honeypot_id]}"
      "[honeypot][type]" => "%{[raw][honeypot_type]}" "[observer][type]" => "honeypot_sensor"
      "[trapsig][sensor_id]" => "%{[fields][sensor_id]}" "message" => "%{[raw][summary]}"
    } }
    if [raw][url][path] { mutate { add_field => { "[url][path]" => "%{[raw][url][path]}" } } }
    if [raw][http][request][method] { mutate { add_field => { "[http][request][method]" => "%{[raw][http][request][method]}" } } }
    if [raw][http][user_agent] { mutate { add_field => { "[http][user_agent]" => "%{[raw][http][user_agent]}" } } }
    if [raw][authentication][username] { mutate { add_field => { "[authentication][username]" => "%{[raw][authentication][username]}" "[authentication][password]" => "%{[raw][authentication][password]}" } } }
    ruby {
      code => '
        mqtt = event.get("[raw][mqtt]")
        if mqtt.is_a?(Hash)
          %w[operation packet_type flags remaining_length client_id protocol_level connect_flags keep_alive username_present password_present packet_id topic qos requested_qos].each do |field|
            value = mqtt[field]
            event.set("[mqtt][#{field}]", value) unless value.nil?
          end
        end
        operation = event.get("[raw][iot][operation]")
        event.set("[iot][operation]", operation) unless operation.nil?

        # ---- schema v2 (persona runtime). Controlled namespaces: only these
        # keys are ever copied, so attacker-chosen field names cannot reach
        # the index mapping.
        v2 = event.get("[raw][schema_version]").to_s == "2"
        event.set("[@metadata][trapsig_schema]", v2 ? "2" : "1")
        transport = event.get("[raw][transport]")
        event.set("[network][transport]", transport) if %w[tcp udp].include?(transport)
        if v2
          spec = {
            "persona" => %w[id name device_type vendor model firmware],
            "modbus" => %w[transaction_id unit_id function_code function address quantity value exception_code write hardening_blocked mei_type read_device_id_code object_id response_length],
            "coap" => %w[version type code method message_id token_length uri_path uri_query content_format payload_length option_count response_code state_change error length],
            "rtsp" => %w[method uri path cseq auth_scheme transport body_length status_code],
            "ftp" => %w[command argument reply_code data_channel_refused],
            "dns" => %w[id opcode recursion_desired qname qtype qclass rcode error],
            "ssdp" => %w[method target st man mx],
            "hardening" => %w[actions decision_id],
            "process" => %w[command_line],
            "s7" => %w[function function_code write identify area address szl_id hardening_blocked],
            "bacnet" => %w[service property object write identify hardening_blocked],
            "enip" => %w[command cip_service write identify],
            "atg" => %w[command write identify hardening_blocked],
            "snmp" => %w[version community pdu oids write error],
            "redis" => %w[command args write exploit],
            "sip" => %w[method to_user from_user user_agent auth_user error],
            "tftp" => %w[opcode filename mode error],
            "vnc" => %w[client_version security_type],
            "rdp" => %w[cookie_user requested_protocols]
          }
          spec.each do |namespace, keys|
            values = event.get("[raw][#{namespace}]")
            next unless values.is_a?(Hash)
            keys.each { |key| value = values[key]; event.set("[#{namespace}][#{key}]", value) unless value.nil? }
          end
          {"community_id" => "[network][community_id]", "connection_id" => "[trapsig][connection_id]", "sequence" => "[trapsig][sequence]",
           "plugin" => "[trapsig][plugin]", "interaction" => "[trapsig][interaction]", "reply_suppressed" => "[trapsig][reply_suppressed]"}.each do |source, target|
            value = event.get("[raw][#{source}]")
            event.set(target, value) unless value.nil?
          end
          excerpt = event.get("[raw][payload_excerpt]")
          event.set("[trapsig][payload_excerpt]", excerpt.to_s[0, 4096]) unless excerpt.nil?
          status = event.get("[raw][http][response][status_code]")
          event.set("[http][response][status_code]", status) unless status.nil?
        end
      '
    }
    date { match => ["[raw][timestamp]", "ISO8601"] target => "@timestamp" }
  }
}
