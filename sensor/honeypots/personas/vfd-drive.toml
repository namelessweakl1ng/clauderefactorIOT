id = "vfd-drive"
version = 1
name = "Varix VF-700 Variable Frequency Drive"
device_type = "drive"
vendor = "Varix"
model = "VF-700"
firmware = "2.18"
description = "Motor drive on EtherNet/IP with an embedded web page."

[fingerprint]
hostname = "vf700-pump4"

[credentials]
accept = [["admin", "1234"]]

[[services]]
name = "enip"
plugin = "enip"
port = 44818
public_port = 44818

[services.options]
vendor_id = 1337
device_type = 2
product_code = 700

[[services]]
name = "web"
plugin = "http-device"
port = 8097
public_port = 8097

[services.options.pages."/"]
body = "<html><title>VF-700</title><body><h1>$model drive</h1><p>Output 41.2 Hz</p></body></html>"
