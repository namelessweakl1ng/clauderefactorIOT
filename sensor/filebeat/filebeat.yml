filebeat.inputs:
  - type: filestream
    id: cowrie
    paths: [/logs/cowrie/*.json]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", honeypot_id: cowrie-01, honeypot_type: ssh_telnet}
  - type: filestream
    id: custom-honeypots
    paths: [/logs/custom/*.jsonl]
    fields_under_root: false
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}"}
  # Optional passive network monitoring (sensor `netmon` profile). With the
  # profile off the directory is empty and these inputs are idle.
  - type: filestream
    id: zeek-conn
    paths: [/logs/zeek/conn*.log]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", log_family: zeek, zeek_log: conn}
  - type: filestream
    id: zeek-dns
    paths: [/logs/zeek/dns*.log]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", log_family: zeek, zeek_log: dns}
  - type: filestream
    id: zeek-http
    paths: [/logs/zeek/http*.log]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", log_family: zeek, zeek_log: http}
  - type: filestream
    id: zeek-ssl
    paths: [/logs/zeek/ssl*.log]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", log_family: zeek, zeek_log: ssl}
processors:
  - add_fields: {target: observer, fields: {name: "${HONEYPOT_HOSTNAME}", type: honeypot_sensor}}
queue.disk:
  max_size: 512MB
  path: /usr/share/filebeat/data/diskqueue
output.logstash:
  hosts: ["${ANALYSIS_HOST}:${LOGSTASH_PORT}"]
logging.level: info
