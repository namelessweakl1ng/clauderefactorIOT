name: mqtt-active-session
id: 1131281e-5bcf-4a46-b4b8-91238803e715
title: Active MQTT client behaviour
status: stable
version: 1
level: low
confidence: 0.65
detection_type: MQTT_PROBING
description: A client went beyond CONNECT (subscribe/publish/unsubscribe) on the decoy broker.
tags: [attack.discovery, attack.t1046]
detection:
  selection:
    mqtt.operation: [subscribe, publish, unsubscribe]
  condition: selection
tests:
  - match: true
    events: [{mqtt: {operation: publish, topic: a/b}}]
  - name: a lone CONNECT stays a negative control
    match: false
    events: [{mqtt: {operation: connect}}]
---
name: mqtt-command-publish
id: 184a3e84-fea5-4a20-8c3c-a8708ff4c776
title: Publish to a device command topic
status: test
version: 1
level: high
confidence: 0.8
detection_type: UNAUTHORIZED_COMMAND
description: Publishing to topics that look like actuator or configuration channels.
tags: [attack.impair-process-control, attack.t0855]
detection:
  selection:
    mqtt.operation: publish
    mqtt.topic|re: '(^|/)(cmd|command|set|control|config|ota|firmware)(/|$)'
  condition: selection
tests:
  - match: true
    events: [{mqtt: {operation: publish, topic: "devices/hvac-01/set"}}]
  - match: false
    events: [{mqtt: {operation: publish, topic: "sensors/temp"}}]
