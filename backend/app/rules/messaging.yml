name: coap-resource-discovery
id: e8dcfe08-0fdc-42d7-b2da-c449396e44d8
title: CoAP resource discovery
status: test
version: 1
level: medium
confidence: 0.85
detection_type: RECONNAISSANCE
description: GET /.well-known/core lists every resource a constrained device exposes (RFC 6690).
tags: [attack.discovery, attack.t1046, attack.t0888]
detection:
  selection:
    coap.uri_path|endswith: .well-known/core
  condition: selection
tests:
  - match: true
    events: [{network: {protocol: coap}, coap: {method: GET, uri_path: /.well-known/core}}]
  - match: false
    events: [{coap: {method: GET, uri_path: /sensors/temp}}]
---
name: coap-state-change
id: 2837b593-c927-4707-9968-7d93a2f65e0a
title: CoAP state-changing request
status: test
version: 1
level: high
confidence: 0.8
detection_type: UNAUTHORIZED_COMMAND
description: PUT/POST/DELETE against a constrained device resource.
tags: [attack.impair-process-control, attack.t0855, attack.t0836]
detection:
  selection:
    coap.method: [PUT, POST, DELETE]
  condition: selection
tests:
  - match: true
    events: [{coap: {method: PUT, uri_path: /actuators/valve}}]
  - match: false
    events: [{coap: {method: GET, uri_path: /actuators/valve}}]
