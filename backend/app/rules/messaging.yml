name: mqtt-topic-enumeration
id: 233851d3-d350-445b-add9-62893417b253
title: MQTT wildcard or system-topic subscription
status: stable
version: 1
level: medium
confidence: 0.85
detection_type: MQTT_PROBING
description: Subscribing to '#', '+' or '$SYS' enumerates the topics the broker serves.
tags: [attack.discovery, attack.t1046, attack.collection, attack.t0861]
detection:
  subscribe:
    mqtt.operation: subscribe
  wildcard:
    mqtt.topic|contains: ["#", "$SYS", "+"]
  condition: subscribe and wildcard
tests:
  - match: true
    events: [{network: {protocol: mqtt}, mqtt: {operation: subscribe, topic: "#"}}]
  - match: false
    events: [{network: {protocol: mqtt}, mqtt: {operation: subscribe, topic: "home/livingroom/temp"}}]
