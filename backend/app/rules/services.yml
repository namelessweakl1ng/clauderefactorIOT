name: ftp-upload-attempt
id: c718edff-55b2-4e4d-8d0a-ad0b80ededf1
title: FTP upload attempt
status: test
version: 1
level: high
confidence: 0.85
detection_type: MALWARE_DOWNLOAD
description: STOR/APPE/STOU - staging a file on the device. The decoy discards all data.
tags: [attack.command-and-control, attack.t1105]
detection:
  selection:
    ftp.command: [STOR, APPE, STOU]
  condition: selection
tests:
  - match: true
    events: [{ftp: {command: STOR, argument: x.sh}}]
  - match: false
    events: [{ftp: {command: LIST}}]
