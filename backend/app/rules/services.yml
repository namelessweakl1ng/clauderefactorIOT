name: iot-line-protocol-command
id: 53c17c0d-9d98-4223-be92-c79204549b83
title: Proprietary IoT line-protocol command
status: stable
level: informational
generate: false
detection:
  selection:
    service.name: iot-service
    iot.operation|exists: true
  condition: selection
tests:
  - match: true
    events: [{service: {name: iot-service}, iot: {operation: status}}]
---
name: iot-service-probe
id: 6752f921-3c7c-4641-9228-c17e00ebae4b
title: Repeated probing of the proprietary IoT service
status: stable
version: 1
level: low
confidence: 0.7
detection_type: RECONNAISSANCE
description: Three or more commands against the VCP line protocol within five minutes.
tags: [attack.discovery, attack.t1046, attack.t0888]
correlation:
  type: event_count
  rules: [iot-line-protocol-command]
  timespan: 5m
  condition: {gte: 3}
tests:
  - match: true
    events: [{service: {name: iot-service}, iot: {operation: info}, repeat: 3}]
  - match: false
    events: [{service: {name: iot-service}, iot: {operation: status}, repeat: 2}]
