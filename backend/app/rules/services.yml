name: rtsp-request
id: f937307c-a183-481d-92d6-ff67707d47c8
title: RTSP request
status: stable
level: informational
generate: false
detection:
  selection:
    rtsp.method|exists: true
  condition: selection
tests:
  - match: true
    events: [{rtsp: {method: DESCRIBE, uri: rtsp://x/stream1}}]
---
name: rtsp-stream-enumeration
id: 8e410e68-25e9-47e4-95da-d75898246351
title: RTSP stream path enumeration
status: test
version: 1
level: medium
confidence: 0.8
detection_type: RECONNAISSANCE
description: Four or more distinct RTSP URIs requested - camera stream-path brute forcing.
tags: [attack.reconnaissance, attack.t1595.003]
correlation:
  type: value_count
  rules: [rtsp-request]
  field: rtsp.uri
  timespan: 5m
  condition: {gte: 4}
tests:
  - match: true
    events:
      - {rtsp: {method: DESCRIBE, uri: "rtsp://h/live"}}
      - {rtsp: {method: DESCRIBE, uri: "rtsp://h/stream1"}}
      - {rtsp: {method: DESCRIBE, uri: "rtsp://h/ch0_0.h264"}}
      - {rtsp: {method: DESCRIBE, uri: "rtsp://h/cam/realmonitor"}}
  - match: false
    events: [{rtsp: {method: OPTIONS, uri: "rtsp://h/"}, repeat: 5}]
