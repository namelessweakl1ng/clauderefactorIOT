name: ssdp-discovery
id: 4bb5ee92-962a-4871-b249-623a333533a0
title: SSDP/UPnP discovery
status: test
version: 1
level: low
confidence: 0.75
detection_type: RECONNAISSANCE
description: M-SEARCH or a device-description fetch - UPnP device enumeration.
tags: [attack.discovery, attack.t1046]
detection:
  msearch:
    ssdp.method: M-SEARCH
  description:
    url.path|endswith: [/rootDesc.xml, /description.xml, /upnp/desc.xml]
  condition: msearch or description
tests:
  - match: true
    events: [{ssdp: {method: M-SEARCH, st: "ssdp:all"}}]
  - match: true
    events: [{url: {path: /rootDesc.xml}}]
  - match: false
    events: [{ssdp: {method: NOTIFY}}]
---
name: dns-reflection-probe
id: 64b0d1e2-7c3a-4b59-9e8f-1a2d3c4e5f60
title: DNS ANY or version probe
status: test
version: 1
level: medium
confidence: 0.75
detection_type: RECONNAISSANCE
description: QTYPE ANY (reflection-amplifier test) or CHAOS version.bind fingerprinting.
tags: [attack.reconnaissance, attack.t1595.002]
detection:
  any_query:
    dns.qtype: ANY
  version:
    dns.qname|endswith: [version.bind, version.server, hostname.bind]
  condition: any_query or version
tests:
  - match: true
    events: [{dns: {qname: example.lab, qtype: ANY}}]
  - match: true
    events: [{dns: {qname: version.bind, qtype: TXT}}]
  - match: false
    events: [{dns: {qname: gateway.lab, qtype: A}}]
