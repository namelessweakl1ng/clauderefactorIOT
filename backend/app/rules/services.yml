name: ftp-anonymous-login
id: 422b714d-7ca4-438f-a246-00774b2ccbc0
title: FTP anonymous login attempt
status: test
version: 1
level: medium
confidence: 0.8
detection_type: DEFAULT_CREDENTIALS
description: USER anonymous/ftp - checking for an open anonymous share.
tags: [attack.initial-access, attack.t1078.001]
detection:
  selection:
    ftp.command: USER
    ftp.argument: [anonymous, ftp]
  condition: selection
tests:
  - match: true
    events: [{ftp: {command: USER, argument: anonymous}}]
  - match: false
    events: [{ftp: {command: USER, argument: backup}}]
