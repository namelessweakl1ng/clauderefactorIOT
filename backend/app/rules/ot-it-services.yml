name: sip-scanner
id: 0b0f4b4a-d9c0-5509-976e-ccd25cf4e125
title: SIP scanner or extension enumeration
status: test
version: 1
level: medium
confidence: 0.8
detection_type: RECONNAISSANCE
tags:
- attack.reconnaissance
- attack.t1595
description: Known scanner user agents (SIPVicious friendly-scanner, sipsak, sundayddr) or OPTIONS probing.
detection:
  agent:
    sip.user_agent|re: (friendly-scanner|sipvicious|sipcli|sundayddr|sipsak|pplsip|iWar)
  options:
    sip.method: OPTIONS
  condition: agent or options
tests:
- match: true
  events:
  - sip:
      method: REGISTER
      user_agent: friendly-scanner
- match: true
  events:
  - sip:
      method: OPTIONS
      user_agent: Zoiper
- match: false
  events:
  - sip:
      method: REGISTER
      user_agent: Zoiper

