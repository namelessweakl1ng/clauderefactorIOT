---
name: snmp-community-guessing
id: 5c8408ea-ee63-543b-a9d2-d56a9931a58e
title: SNMP community-string guessing
status: test
version: 1
level: high
confidence: 0.8
detection_type: BRUTE_FORCE
tags:
- attack.credential-access
- attack.t1110.001
description: Four or more distinct community strings tried within five minutes (onesixtyone-style).
correlation:
  type: value_count
  rules:
  - snmp-request
  field: snmp.community
  timespan: 5m
  condition:
    gte: 4
tests:
- match: true
  events:
  - snmp:
      pdu: get
      community: a
  - snmp:
      pdu: get
      community: b
  - snmp:
      pdu: get
      community: c
  - snmp:
      pdu: get
      community: d
- match: false
  events:
  - snmp:
      pdu: get
      community: public
    repeat: 6

