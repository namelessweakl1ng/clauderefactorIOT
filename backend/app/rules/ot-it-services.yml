name: snmp-default-community
id: 889da462-afb0-5c58-bc15-d6cca89a5e85
title: SNMP default community string
status: test
version: 1
level: medium
confidence: 0.8
detection_type: DEFAULT_CREDENTIALS
tags:
- attack.initial-access
- attack.t1078.001
description: The public/private community strings are the default credentials of SNMP agents.
detection:
  selection:
    snmp.community:
    - public
    - private
    - community
    - admin
  condition: selection
tests:
- match: true
  events:
  - snmp:
      community: public
      pdu: get
- match: false
  events:
  - snmp:
      community: c0mpl3x!
      pdu: get

