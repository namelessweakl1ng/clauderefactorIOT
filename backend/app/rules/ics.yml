name: modbus-device-identification
id: 52f93b35-e129-4407-91ce-4d5185eb8e63
title: Modbus device identification request
status: test
version: 1
level: medium
confidence: 0.9
detection_type: ICS_RECONNAISSANCE
description: Function 43 (Read Device Identification) or 17 (Report Server ID) - vendor/model fingerprinting.
tags: [attack.discovery, attack.t0888]
detection:
  selection:
    modbus.function_code: [43, 17]
  condition: selection
tests:
  - match: true
    events: [{network: {protocol: modbus}, modbus: {function_code: 43}}]
  - match: false
    events: [{network: {protocol: modbus}, modbus: {function_code: 3}}]
