# Authentication-focused rules shared by every protocol that reports credentials.
name: authentication-failure
id: b7bb09cd-f80f-4bff-9eac-bc153e4dfc24
title: Failed authentication attempt
status: stable
level: informational
generate: false
description: Building block for credential-guessing correlations.
detection:
  selection:
    event.category: authentication
    event.outcome: failure
  condition: selection
tests:
  - name: failed login matches
    match: true
    events: [{event: {category: authentication, outcome: failure}}]
  - name: successful login does not
    match: false
    events: [{event: {category: authentication, outcome: success}}]
---
name: authentication-attempt
id: ab1a636f-cb8f-40d7-92ca-eb37bf52cc0b
title: Any authentication attempt
status: stable
level: informational
generate: false
description: Building block - any submitted credential regardless of outcome.
detection:
  selection:
    event.category: authentication
  condition: selection
tests:
  - match: true
    events: [{event: {category: authentication, outcome: success}}]
  - match: false
    events: [{event: {category: web}}]
---
name: password-guessing
id: 3cf05878-2552-4974-abe8-e4c31eade2ec
title: Password guessing against one service
status: stable
version: 1
level: high
confidence: 0.85
detection_type: BRUTE_FORCE
description: Five or more failed authentications against the same service within five minutes.
tags: [attack.credential-access, attack.t1110.001]
falsepositives: [A legitimate operator mistyping a password repeatedly (unlikely on a decoy)]
correlation:
  type: event_count
  rules: [authentication-failure]
  group_by: [service.name]
  timespan: 5m
  condition: {gte: 5}
tests:
  - name: five failures in five seconds
    match: true
    events: [{event: {category: authentication, outcome: failure}, service: {name: cowrie}, repeat: 5}]
  - name: four failures is below threshold
    match: false
    events: [{event: {category: authentication, outcome: failure}, service: {name: cowrie}, repeat: 4}]
  - name: five failures spread over an hour do not correlate
    match: false
    events: [{event: {category: authentication, outcome: failure}, service: {name: cowrie}, repeat: 5, every_seconds: 900}]
  - name: failures split across services do not pool
    match: false
    events:
      - {event: {category: authentication, outcome: failure}, service: {name: cowrie}, repeat: 3}
      - {event: {category: authentication, outcome: failure}, service: {name: camera}, repeat: 3}
---
name: password-spraying
id: 7445a3c6-68a3-485e-8b17-9203dd1e51b3
title: Password spraying across usernames
status: test
version: 1
level: high
confidence: 0.75
detection_type: BRUTE_FORCE
description: Four or more distinct usernames tried within ten minutes - typical of spraying and credential-stuffing lists.
tags: [attack.credential-access, attack.t1110.003, attack.t1110.004]
correlation:
  type: value_count
  rules: [authentication-attempt]
  field: authentication.username
  timespan: 10m
  condition: {gte: 4}
tests:
  - match: true
    events:
      - {event: {category: authentication, outcome: failure}, authentication: {username: admin}}
      - {event: {category: authentication, outcome: failure}, authentication: {username: root}}
      - {event: {category: authentication, outcome: failure}, authentication: {username: support}}
      - {event: {category: authentication, outcome: failure}, authentication: {username: user}}
  - name: one username repeated is guessing, not spraying
    match: false
    events: [{event: {category: authentication, outcome: failure}, authentication: {username: admin}, repeat: 8}]
---
name: default-credential-attempt
id: fe92876f-42af-4649-a0ac-cdaefc5b70b4
title: Publicly known default credential submitted
status: stable
version: 1
level: medium
confidence: 0.8
detection_type: DEFAULT_CREDENTIALS
description: A credential pair from the shared public default-credential list was submitted.
tags: [attack.initial-access, attack.t1078.001, attack.t0812]
detection:
  selection:
    trapsig.derived.known_default_credential: true
  condition: selection
tests:
  - match: true
    events: [{event: {category: authentication, outcome: failure}, authentication: {username: admin, password: admin}}]
  - match: false
    events: [{event: {category: authentication, outcome: failure}, authentication: {username: operator, password: "S3cured-Pa55!"}}]
---
name: default-credential-success
id: 8f0684f4-9c56-40e6-b503-d237acad3008
title: Successful login with a known default credential
status: stable
version: 1
level: critical
confidence: 0.95
detection_type: DEFAULT_CREDENTIALS
description: The decoy accepted a publicly known default credential - the attacker now believes it holds a valid account.
tags: [attack.initial-access, attack.t1078.001, attack.t0812]
detection:
  selection:
    trapsig.derived.known_default_credential: true
    event.outcome: success
  condition: selection
tests:
  - match: true
    events: [{event: {category: authentication, outcome: success}, authentication: {username: root, password: root}}]
  - match: false
    events: [{event: {category: authentication, outcome: failure}, authentication: {username: root, password: root}}]
