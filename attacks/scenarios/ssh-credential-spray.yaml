id: ssh-credential-spray
name: SSH credential spraying
description: Twelve distinct username/password pairs from public IoT default lists, one attempt each, no success.
trial_kind: attack
target_services:
- ssh
expected_detection: BRUTE_FORCE
severity: high
models: T1110.003
steps:
- service: ssh
  credentials:
  - - admin
    - '1234'
  - - ubnt
    - ubnt
  - - support
    - support
  - - user
    - user
  - - guest
    - '12345'
  - - pi
    - raspberry
  - - operator
    - operator
  - - service
    - service
  - - tech
    - tech
  - - default
    - default
  - - root
    - anko
  - - '666666'
    - '666666'
  attempt_interval: 0.5
